name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  NEXUS_DEMO_MODE: "true"

jobs:
  # ---------------------------------------------------------------- python + kernel
  test:
    name: tests · python · native kernel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Build the native graph kernel (C++)
        run: |
          make -C native -j4
          make -C native test

      - name: Validate and rebuild the demo corpus
        run: |
          python scripts/build_corpus.py --check
          python scripts/build_corpus.py

      - name: Preflight
        run: python run.py --check

      - name: Run the test suite
        run: python -m pytest -q

      - name: Start the server, then run the end-to-end smoke sweep
        run: |
          python run.py --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/ping >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/ping >/dev/null
          ./scripts/smoke.sh

      - name: Upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-server-log
          path: |
            *.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------- front end
  frontend:
    name: frontend · no CDN · syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vendored three.js must be present
        run: |
          test -s frontend/vendor/three.module.js
          test -s frontend/vendor/OrbitControls.js

      - name: No external CDN may be referenced
        run: |
          if grep -Ei 'https?://(cdn|unpkg|jsdelivr|esm\.sh)' -r frontend/index.html frontend/assets; then
            echo "::error::frontend references an external CDN — the demo must run offline"
            exit 1
          fi

      - name: ES module syntax check
        run: |
          for f in frontend/assets/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

  # ---------------------------------------------------------------- polyglot
  polyglot:
    name: polyglot sidecars · kotlin · go · dotnet · ruby
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps for the parity scripts
        run: pip install -r backend/requirements.txt

      - name: Go — vet, build, self-test
        run: |
          cd polyglot/go
          go vet ./...
          go build -o /tmp/nexus-ingest .
          /tmp/nexus-ingest test

      - name: .NET — build and self-test the export sidecar
        run: |
          cd polyglot/dotnet
          dotnet build -c Release NexusExport.csproj
          dotnet run -c Release --project NexusExport.csproj -- test

      - name: Kotlin — kotlinc from npm (the same recipe the README documents), self-test
        run: |
          npm pack kotlin-compiler
          tar xzf kotlin-compiler-*.tgz
          package/bin/kotlinc polyglot/kotlin/src/main/kotlin/NexusPlanner.kt -include-runtime -d /tmp/planner.jar
          java -jar /tmp/planner.jar --test
          java -jar /tmp/planner.jar --plan 'topic:"AI Agents" type in (Paper, Method) limit 40'

      - name: Kotlin planner — live sidecar, plan endpoint and Python parity
        run: |
          java -jar /tmp/planner.jar --serve 8092 &
          for _ in $(seq 1 30); do curl -sf localhost:8092/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8092/health
          python scripts/compare_planners.py --url http://127.0.0.1:8092
          python scripts/compare_planners.py --jar /tmp/planner.jar --quiet

      - name: Ruby — self-test, HTTP sidecar, and parity with the Python engine
        run: |
          if ! command -v ruby >/dev/null 2>&1; then
            echo "::warning::no system ruby on this runner; the resolver logic was verified on CRuby 3.2 (ruby.wasm) — see polyglot/README.md"
            exit 0
          fi
          ruby -v
          ruby polyglot/ruby/claim_resolver.rb --test

          python - <<'PY'
          import json
          corpus = json.load(open("data/demo/corpus.json"))
          claims = [{"id": c["id"], "paper_id": c["paper"], "text": c["text"]} for c in corpus["claims"]]
          json.dump({"claims": claims}, open("/tmp/claims.json", "w"))
          print(f"{len(claims)} claims written to /tmp/claims.json")
          PY

          # CLI path
          ruby polyglot/ruby/claim_resolver.rb /tmp/claims.json > /tmp/ruby_cli.json
          python scripts/compare_claim_engines.py /tmp/ruby_cli.json

          # HTTP path (the contract NEXUS_CLAIM_URL expects)
          ruby polyglot/ruby/claim_resolver.rb --serve 8093 &
          for _ in $(seq 1 30); do curl -sf localhost:8093/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8093/health
          curl -sf -X POST localhost:8093/resolve -H 'content-type: application/json' \
            --data @/tmp/claims.json > /tmp/ruby_http.json
          python scripts/compare_claim_engines.py /tmp/ruby_http.json

  # ------------------------------------------------------------------ container
  container:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (no push)
        run: docker build -t nexus:ci .
      - name: Boot the container and probe the API
        run: |
          docker run -d --rm --name nexus-ci -p 8000:8000 nexus:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/ping >/dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:8000/api/health | head -c 400
          curl -sf http://127.0.0.1:8000/api/gaps -X POST \
            -H 'content-type: application/json' \
            -d '{"topic":"AI Agents","top_k":1}' >/dev/null
          docker stop nexus-ci
