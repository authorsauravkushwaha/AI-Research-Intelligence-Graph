name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  NEXUS_DEMO_MODE: "true"

jobs:
  # ---------------------------------------------------------------- python + kernel
  test:
    name: tests · python · native kernel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Build the native graph kernel (C++)
        run: |
          make -C native -j4
          make -C native test

      - name: Validate and rebuild the demo corpus
        run: |
          python scripts/build_corpus.py --check
          python scripts/build_corpus.py

      - name: Preflight
        run: python run.py --check

      - name: Run the test suite
        run: python -m pytest -q

      - name: Start the server, then run the end-to-end smoke sweep
        run: |
          python run.py --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/ping >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/ping >/dev/null
          ./scripts/smoke.sh

      - name: Upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-server-log
          path: |
            *.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------- front end
  frontend:
    name: frontend · no CDN · syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vendored three.js must be present
        run: |
          test -s frontend/vendor/three.module.js
          test -s frontend/vendor/OrbitControls.js

      - name: No external CDN may be referenced
        run: |
          if grep -Ei 'https?://(cdn|unpkg|jsdelivr|esm\.sh)' -r frontend/index.html frontend/assets; then
            echo "::error::frontend references an external CDN — the demo must run offline"
            exit 1
          fi

      - name: ES module syntax check
        run: |
          for f in frontend/assets/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

  # ---------------------------------------------------------------- polyglot
  polyglot:
    name: polyglot sidecars · kotlin · go · dotnet · ruby
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Go — vet, build, self-test
        run: |
          cd polyglot/go
          go vet ./...
          go build -o /tmp/nexus-ingest .
          /tmp/nexus-ingest test

      - name: .NET — build and self-test the export sidecar
        run: |
          cd polyglot/dotnet
          dotnet build -c Release NexusExport.csproj
          dotnet run -c Release --project NexusExport.csproj -- test

      - name: Kotlin — compile with the embeddable compiler and self-test the planner
        run: |
          cd polyglot/kotlin
          curl -sSLo /tmp/kotlin-compiler.zip \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler/1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlinc
          /tmp/kotlinc/kotlinc/bin/kotlinc src/main/kotlin/NexusPlanner.kt -include-runtime -d /tmp/planner.jar
          java -jar /tmp/planner.jar --test
          java -jar /tmp/planner.jar --plan "papers about agent memory since 2023"

      - name: Ruby — self-test the claim resolver
        run: |
          if command -v ruby >/dev/null 2>&1; then
            ruby polyglot/ruby/claim_resolver.rb --test
          else
            echo "::warning::no system ruby on this runner; the resolver was verified on CRuby 3.2 (ruby.wasm) against the python engine — see polyglot/README.md"
          fi

      - name: Ruby vs Python parity on the demo corpus
        run: |
          if command -v ruby >/dev/null 2>&1; then
            python -c "
          import json
          c = json.load(open('data/demo/corpus.json'))
          json.dump({'claims': [{'id': x['id'], 'paper_id': x['paper'], 'text': x['text']} for x in c['claims']]}, open('/tmp/claims.json', 'w'))
          "
            ruby polyglot/ruby/claim_resolver.rb /tmp/claims.json > /tmp/ruby.json
            python scripts/compare_claim_engines.py /tmp/ruby.json
          else
            echo "::warning::skipping the ruby/python parity run (no system ruby)"
          fi

  # ------------------------------------------------------------------ container
  container:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (no push)
        run: docker build -t nexus:ci .
      - name: Boot the container and probe the API
        run: |
          docker run -d --rm --name nexus-ci -p 8000:8000 nexus:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/ping >/dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:8000/api/health | head -c 400
          curl -sf http://127.0.0.1:8000/api/gaps -X POST \
            -H 'content-type: application/json' \
            -d '{"topic":"AI Agents","top_k":1}' >/dev/null
          docker stop nexus-ci
