name: pages

# Publishes the backend-free snapshot of NEXUS as a website + installable app.
#
# The job is the same thing a developer runs locally:
#   1. build the static site with the real engines (scripts/build_site.py drives the
#      FastAPI app in-process, so graph.json, the gap scores, the agent answers and the
#      reports are produced by the same code the API serves);
#   2. verify it — the Node checker boots the *published* assets/site.js against the
#      freshly built snapshot and replays every recorded engine answer through it, so a
#      build that would answer differently from the API never reaches a reader;
#   3. upload the verified folder as the Pages artefact.
# A failing verification fails the deploy: the published site is never an unverified one.

on:
  # `main` is the published site. The working branch is listed too so that a change to the
  # front end, the builder or the checker is verified by the same pipeline that publishes it
  # before it is merged — same artefact either way, newest push wins.
  push:
    branches: ["main", "arena/a214f69c-ai-research-intelligence-graph"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  NEXUS_DEMO_MODE: "true"

jobs:
  build:
    name: build · verify · upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/requirements-site.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r scripts/requirements-site.txt

      - name: Build the static site (same engines as the API)
        run: python scripts/build_site.py --out site

      - name: Verify the snapshot — replay every recorded engine answer through the shipped site.js
        run: node scripts/check_site_data.mjs --site site --json "$RUNNER_TEMP/site-checks.json"

      - name: Summarise the artefact
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import pathlib

          site = pathlib.Path("site")
          files = [p for p in site.rglob("*") if p.is_file()]
          size = sum(p.stat().st_size for p in files) / 1048576
          graph = json.loads((site / "data" / "graph.json").read_text())
          print("### NEXUS static build")
          print()
          print(f"- size: {size:.1f} MiB in {len(files)} files")
          print(f"- recorded API payloads: {len(list((site / 'data').iterdir()))}")
          print(f"- graph snapshot: {graph['counts']['nodes']} nodes / {graph['counts']['edges']} edges")
          checks = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "site-checks.json").read_text())
          summary = checks["summary"]
          print(f"- verification: {summary['total'] - summary['failed']}/{summary['total']} checks passed "
                f"({summary['compared']} values compared against the engine's own answers)")
          for note in checks.get("notes", [])[:3]:
              print(f"- {note}")
          PY

      - name: Configure Pages (enables the Pages site on the first run)
        uses: actions/configure-pages@v5
        with:
          # the workflow token carries `pages: write`, so a repository that has never had
          # Pages switched on gets the site created here instead of failing the deploy
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
