# NEXUS — full stack.
#
#   docker compose up --build          # Neo4j + API + front end (http://localhost:8000)
#   docker compose up neo4j           # graph database only (for a local dev run)
#
# Secrets are read from `.env` (never committed) — see .env.example.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: nexus-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
    volumes:
      - nexus-neo4j-data:/data
      - ./cypher:/import/cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      NEXUS_ENABLE_NEO4J: "true"
      NEXUS_USE_GDS: "true"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      NEXUS_DEMO_MODE: "true"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

volumes:
  nexus-neo4j-data:
